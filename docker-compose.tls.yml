# =====================================================================
# Cloudflare Full (strict) 용 TLS 오버레이
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.prod.yml \
#                  -f docker-compose.tls.yml up -d
#
# Caddy 가 443 에서 Cloudflare Origin 인증서로 TLS 를 종료하고
# 내부 네트워크로 app:8080 에 프록시합니다.
#
# 사전 준비 (서버에서 1회):
#   sudo mkdir -p /etc/buildify-tls
#   sudo tee /etc/buildify-tls/origin.pem > /dev/null   # 인증서 붙여넣고 Ctrl+D
#   sudo tee /etc/buildify-tls/origin.key > /dev/null   # 개인키 붙여넣고 Ctrl+D
#   sudo chmod 600 /etc/buildify-tls/origin.key
#
# 이 파일을 쓰지 않으면 기존 구성(80 포트, Flexible)이 그대로 동작합니다.
# =====================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: buildify-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/buildify-tls:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      TZ: Asia/Seoul
    mem_limit: 96m
    mem_reservation: 32m

  app:
    # Caddy 가 앞단을 맡으므로 호스트의 80 포트 공개는 더 이상 필요하지 않습니다.
    # Cloudflare 는 Full (strict) 에서 443 으로만 접속합니다.
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
